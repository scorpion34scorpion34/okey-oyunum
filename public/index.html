<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c6b33">
  <title>Neşeli Sohbet Oyunlar · Okey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= ANA MENÜ ================= -->
  <section id="menu" class="ekran">
    <div class="menu-ust">
      <div class="profil-cip" id="menuProfil"><span class="simge">😀</span><span class="isim">Oyuncu</span></div>
      <button class="ikon-dugme" id="menuAyar" title="Ayarlar">⚙️</button>
    </div>

    <h1 class="baslik"><span>Neşeli</span> <span>Sohbet</span> <span>Oyunlar</span></h1>
    <p class="alt-baslik">Arkadaşlarınla sohbet ederek okey oyna</p>

    <div class="logo">
      <div class="logo-istaka">
        <div class="tas kirmizi">7</div>
        <div class="tas mavi">7</div>
        <div class="tas siyah">7</div>
        <div class="tas sahte">★</div>
      </div>
      <div class="logo-balon">Okey! 🎉</div>
      <div class="logo-yazi">OKEY</div>
    </div>

    <div class="menu-dugmeler">
      <button class="dugme altin" id="btnBilgisayar">🖥️ Bilgisayara karşı</button>
      <button class="dugme" id="btnOnline">🌐 Online oyna</button>
      <div class="menu-kucukler">
        <button class="dugme" id="btnYardim"><b>💡</b>Nasıl oynanır?</button>
        <button class="dugme" id="btnKurallar"><b>📖</b>Kurallar</button>
        <button class="dugme" id="btnIstatistik"><b>📊</b>İstatistikler</button>
      </div>
    </div>
    <div class="etiketler">ÜCRETSİZ · REKLAMSIZ · SOHBETLİ</div>
  </section>

  <!-- ================= LOBİ ================= -->
  <section id="lobi" class="ekran gizli">
    <div class="ust-cubuk">
      <button class="ikon-dugme" id="lobiGeri" title="Geri">‹</button>
      <h2>Online oyna</h2>
      <span class="cip" id="baglantiDurum">● Bağlanıyor</span>
    </div>
    <div>
      <div class="sekmeler">
        <button class="secik" data-sekme="masalar">🎲 Masalar</button>
        <button data-sekme="lobiSohbet">💬 Sohbet <span id="lobiRozet"></span></button>
      </div>
      <div class="lobi-govde" id="sekme-masalar">
        <div class="buyuk-secenekler">
          <button class="dugme altin" id="btnHizli">⚡ Hızlı oyun<small>Açık bir masaya otomatik katıl</small></button>
          <button class="dugme" id="btnMasaKur">👥 Arkadaşlarla oyna<small>Masa kur, kodu paylaş</small></button>
        </div>
        <div class="kod-satir">
          <input class="metin-kutu" id="kodGir" maxlength="4" placeholder="MASA KODU">
          <button class="dugme" id="btnKodKatil">Katıl</button>
        </div>
        <div class="bolum-baslik">Açık masalar</div>
        <div id="masaListe"></div>
      </div>
      <div class="lobi-govde gizli" id="sekme-lobiSohbet" style="height: 60vh;">
        <div class="sohbet" id="lobiSohbetKutu"></div>
      </div>
    </div>
  </section>

  <!-- ================= MASA ================= -->
  <section id="masa" class="ekran gizli">
    <div class="masa-ust">
      <button class="ikon-dugme" id="masaMenu" title="Menü">☰</button>
      <div class="orta">
        <span class="cip" id="bicimCip">Tek el</span>
        <span class="cip tikla" id="kodCip" title="Kodu kopyala">Masa: ----</span>
        <span class="cip yatay-ipucu">↻ Yan çevirirsen taşlar büyür</span>
      </div>
      <button class="ikon-dugme" id="sesDugme" title="Ses">🔊</button>
      <button class="ikon-dugme" id="sohbetDugme" title="Sohbet">💬<span class="rozet gizli" id="sohbetRozet">0</span></button>
    </div>

    <div class="masa-govde">
      <div class="masa-alan" id="masaAlan">
        <div id="oyuncular"></div>
        <div id="yiginlar"></div>
        <div class="orta-alan">
          <div class="deste" id="deste"><div class="tas">0</div><div class="tas" id="desteSayi">0</div></div>
          <div class="gosterge-kutu" id="gostergeKutu">
            <div id="gostergeTas"></div>
            <small>GÖSTERGE</small>
            <div class="okey-cip" id="okeyCip"></div>
          </div>
        </div>
        <div class="durum-yazi" id="durumYazi"></div>
        <div id="katman"></div>
      </div>

      <aside class="sohbet-panel" id="sohbetPanel">
        <div class="bas"><span>💬 Masa sohbeti</span><button class="dugme kucuk" id="sohbetKapat">✕</button></div>
        <div class="sohbet" id="masaSohbetKutu"></div>
      </aside>
    </div>

    <div class="alt-bolum">
      <div class="yan-dugmeler" style="position: relative;">
        <div class="diz-menu gizli" id="dizMenu">
          <button class="dugme" data-diz="seri">Seriler</button>
          <button class="dugme" data-diz="per">Perler</button>
          <button class="dugme" data-diz="cift">Çiftler</button>
        </div>
        <button class="dugme" id="dizDugme"><b>⇅</b>Diz</button>
      </div>
      <div class="istaka" id="istaka"></div>
      <div class="yan-dugmeler">
        <button class="dugme" id="atDugme" disabled><b>⬆</b>At</button>
        <button class="dugme" id="bitirDugme" disabled><b>🏁</b>Bitir</button>
      </div>
    </div>
  </section>

  <div id="pencereler"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/bitis.js"></script>
  <script src="app.js"></script>
</body>
</html>
